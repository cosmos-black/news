<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmos News</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#03040a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cosmos News">
<script>
  if ('serviceWorker' in navigator)
    navigator.serviceWorker.register('sw.js');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #03040a;
    --surface: #080c18;
    --card: #0c1220;
    --card-hover: #111828;
    --border: rgba(255,255,255,0.07);
    --border-bright: rgba(255,255,255,0.14);
    --accent: #4fc3f7;
    --accent2: #7c4dff;
    --accent3: #f06292;
    --text: #e8eaf0;
    --text-muted: #6b7a99;
    --text-dim: #3a4560;
    --star: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Stars background */
  #starfield {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 16px;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 0 20px;
    border-bottom: 1px solid var(--border);
    gap: 16px;
    flex-wrap: wrap;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 36px; height: 36px;
    background: radial-gradient(circle at 40% 40%, #7c4dff, #03040a);
    border-radius: 50%;
    border: 1.5px solid var(--accent2);
    box-shadow: 0 0 18px rgba(124,77,255,0.5);
    position: relative;
    flex-shrink: 0;
  }

  .logo-icon::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 8px; height: 8px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 8px #fff;
  }

  .logo-text {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.18em;
    color: #fff;
  }

  .logo-text span {
    color: var(--accent);
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(79,195,247,0.1);
    border: 1px solid rgba(79,195,247,0.25);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
  }

  .live-dot {
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 1.8s ease-in-out infinite;
    box-shadow: 0 0 6px var(--accent);
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  /* Search */
  .search-bar {
    margin: 24px 0 0;
    position: relative;
  }

  .search-bar input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 50px 14px 44px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .search-bar input:focus {
    border-color: rgba(79,195,247,0.4);
    box-shadow: 0 0 0 3px rgba(79,195,247,0.06);
  }

  .search-bar input::placeholder { color: var(--text-dim); }

  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 16px;
    pointer-events: none;
  }

  .search-clear {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    cursor: pointer;
    font-size: 18px;
    display: none;
    background: none;
    border: none;
    line-height: 1;
    padding: 2px;
  }

  .search-clear:hover { color: var(--text); }

  /* Categories */
  .categories {
    display: flex;
    gap: 8px;
    margin: 16px 0 0;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }

  .categories::-webkit-scrollbar { display: none; }

  .cat-btn {
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 14px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.18s;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .cat-btn:hover {
    border-color: var(--border-bright);
    color: var(--text);
  }

  .cat-btn.active {
    background: rgba(79,195,247,0.12);
    border-color: rgba(79,195,247,0.35);
    color: var(--accent);
  }

  /* Stats bar */
  .stats-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 24px 0 16px;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
  }

  .stats-count { color: var(--text); font-weight: 700; }

  /* News grid */
  .news-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }

  @media (min-width: 640px) {
    .news-grid { grid-template-columns: 1fr 1fr; }
    .news-grid .card:first-child { grid-column: span 2; }
  }

  /* Card */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
    animation: fadeIn 0.4s ease forwards;
    opacity: 0;
    text-decoration: none;
    display: block;
    color: inherit;
  }

  .card:hover {
    transform: translateY(-2px);
    border-color: var(--border-bright);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    background: var(--card-hover);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-img {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    background: var(--surface);
    display: block;
  }

  .card-img-placeholder {
    width: 100%;
    aspect-ratio: 16/9;
    background: linear-gradient(135deg, #080c18 0%, #0f1a2e 50%, #080c18 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    position: relative;
    overflow: hidden;
  }

  .card-img-placeholder::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 30% 40%, rgba(124,77,255,0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 60%, rgba(79,195,247,0.1) 0%, transparent 50%);
  }

  .card-body {
    padding: 14px;
  }

  .card-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    gap: 8px;
  }

  .card-source {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 60%;
  }

  .card-date {
    font-size: 10px;
    color: var(--text-dim);
    flex-shrink: 0;
  }

  .card-title {
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.4;
    color: var(--text);
    margin-bottom: 8px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* First card bigger */
  .card:first-child .card-title {
    font-size: 20px;
    -webkit-line-clamp: 2;
  }

  .card-summary {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 10px;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  .card-tag {
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: rgba(124,77,255,0.15);
    border: 1px solid rgba(124,77,255,0.25);
    border-radius: 4px;
    padding: 3px 8px;
    color: #b39ddb;
  }

  .card-link {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.06em;
  }

  /* Loading */
  .loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 0;
    gap: 16px;
  }

  .loading-orb {
    width: 48px; height: 48px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  /* Error / Empty */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }

  .empty-state .icon { font-size: 40px; margin-bottom: 16px; }
  .empty-state p { font-size: 13px; line-height: 1.7; }

  /* Load more */
  .load-more-wrap {
    text-align: center;
    padding: 32px 0;
  }

  .load-more-btn {
    background: transparent;
    border: 1px solid var(--border-bright);
    border-radius: 8px;
    padding: 12px 32px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
  }

  .load-more-btn:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 16px rgba(79,195,247,0.1);
  }

  .load-more-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Footer */
  footer {
    margin-top: 40px;
    padding: 20px 0 32px;
    border-top: 1px solid var(--border);
    text-align: center;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    line-height: 1.8;
  }
</style>
</head>
<body>

<canvas id="starfield"></canvas>

<div class="app">
  <header>
    <div class="logo">
      <div class="logo-icon"></div>
      <div class="logo-text">Sky<span>News</span></div>
    </div>
    <div class="header-right">
      <div class="live-badge">
        <div class="live-dot"></div>
        Live Feed
      </div>
    </div>
  </header>

  <div class="search-bar">
    <span class="search-icon">⌕</span>
    <input type="text" id="searchInput" placeholder="Search space news…">
    <button class="search-clear" id="searchClear">×</button>
  </div>

  <div class="categories" id="categories">
    <button class="cat-btn active" data-cat="">All</button>
    <button class="cat-btn" data-cat="NASA">NASA</button>
    <button class="cat-btn" data-cat="SpaceX">SpaceX</button>
    <button class="cat-btn" data-cat="ESA">ESA</button>
    <button class="cat-btn" data-cat="Mars">Mars</button>
    <button class="cat-btn" data-cat="Moon">Moon</button>
    <button class="cat-btn" data-cat="Telescope">Telescope</button>
    <button class="cat-btn" data-cat="Launch">Launch</button>
    <button class="cat-btn" data-cat="ISS">ISS</button>
  </div>

  <div class="stats-bar">
    <div id="statsText">Loading…</div>
  </div>

  <div id="newsContainer">
    <div class="loading">
      <div class="loading-orb"></div>
      <div class="loading-text">Scanning the universe…</div>
    </div>
  </div>

  <div class="load-more-wrap" id="loadMoreWrap" style="display:none">
    <button class="load-more-btn" id="loadMoreBtn">Load more articles</button>
  </div>

  <footer>
    Cosmos News<br>
    Powered by Spaceflight News API · Data refreshes automatically
  </footer>
</div>

<script>
// ── Starfield ──────────────────────────────────────────────
const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');
let stars = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

function initStars() {
  stars = [];
  const count = Math.floor((canvas.width * canvas.height) / 3500);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.2,
      alpha: Math.random() * 0.6 + 0.2,
      speed: Math.random() * 0.3 + 0.05,
      twinkleOffset: Math.random() * Math.PI * 2
    });
  }
}

function drawStars(t) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  stars.forEach(s => {
    const twinkle = 0.5 + 0.5 * Math.sin(t * s.speed + s.twinkleOffset);
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${s.alpha * twinkle})`;
    ctx.fill();
  });
  requestAnimationFrame(drawStars);
}

resizeCanvas(); initStars(); requestAnimationFrame(drawStars);
window.addEventListener('resize', () => { resizeCanvas(); initStars(); });

// ── State ──────────────────────────────────────────────────
const API_BASE = 'https://api.spaceflightnewsapi.net/v4';
const PAGE_SIZE = 12;
let allArticles = [];
let filtered = [];
let offset = 0;
let activeCategory = '';
let searchQuery = '';
let loading = false;
let totalCount = 0;

// ── Fetch ──────────────────────────────────────────────────
async function fetchArticles(loadMore = false) {
  if (loading) return;
  loading = true;

  if (!loadMore) {
    offset = 0;
    allArticles = [];
    showLoading();
  } else {
    document.getElementById('loadMoreBtn').disabled = true;
    document.getElementById('loadMoreBtn').textContent = 'Loading…';
  }

  try {
    const params = new URLSearchParams({
      limit: PAGE_SIZE,
      offset: offset,
      ordering: '-published_at'
    });
    if (searchQuery) params.set('search', searchQuery);
    if (activeCategory) params.set('search', (searchQuery ? searchQuery + ' ' : '') + activeCategory);

    const res = await fetch(`${API_BASE}/articles/?${params}`);
    if (!res.ok) throw new Error('API error');
    const data = await res.json();

    totalCount = data.count;
    allArticles = loadMore ? [...allArticles, ...data.results] : data.results;
    offset += data.results.length;

    renderArticles();
    updateStats();
    updateLoadMore(data.next);
  } catch (e) {
    showError();
  }

  loading = false;
}

// ── Render ─────────────────────────────────────────────────
function showLoading() {
  document.getElementById('newsContainer').innerHTML = `
    <div class="loading">
      <div class="loading-orb"></div>
      <div class="loading-text">Scanning the universe…</div>
    </div>`;
  document.getElementById('loadMoreWrap').style.display = 'none';
  document.getElementById('statsText').textContent = 'Loading…';
}

function showError() {
  document.getElementById('newsContainer').innerHTML = `
    <div class="empty-state">
      <div class="icon">🛸</div>
      <p>Could not connect to the news feed.<br>Check your internet connection and try again.</p>
    </div>`;
}

function formatDate(iso) {
  const d = new Date(iso);
  const now = new Date();
  const diff = Math.floor((now - d) / 60000);
  if (diff < 60) return `${diff}m ago`;
  if (diff < 1440) return `${Math.floor(diff/60)}h ago`;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function getTag(article) {
  const title = (article.title + ' ' + (article.summary || '')).toLowerCase();
  if (title.includes('nasa')) return 'NASA';
  if (title.includes('spacex')) return 'SpaceX';
  if (title.includes('esa') || title.includes('european')) return 'ESA';
  if (title.includes('mars')) return 'Mars';
  if (title.includes('moon') || title.includes('lunar')) return 'Moon';
  if (title.includes('launch') || title.includes('rocket')) return 'Launch';
  if (title.includes('telescope') || title.includes('jwst') || title.includes('hubble')) return 'Telescope';
  if (title.includes('iss') || title.includes('station')) return 'ISS';
  return 'Space';
}

function cardHTML(article, index) {
  const delay = (index % PAGE_SIZE) * 0.04;
  const img = article.image_url
    ? `<img class="card-img" src="${article.image_url}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    : '';
  const placeholder = `<div class="card-img-placeholder" style="${article.image_url ? 'display:none' : ''}">🔭</div>`;

  return `
    <a class="card" href="${article.url}" target="_blank" rel="noopener" style="animation-delay:${delay}s">
      ${img}${placeholder}
      <div class="card-body">
        <div class="card-meta">
          <span class="card-source">${article.news_site || 'Unknown'}</span>
          <span class="card-date">${formatDate(article.published_at)}</span>
        </div>
        <div class="card-title">${article.title}</div>
        ${article.summary ? `<div class="card-summary">${article.summary}</div>` : ''}
        <div class="card-footer">
          <span class="card-tag">${getTag(article)}</span>
          <span class="card-link">Read →</span>
        </div>
      </div>
    </a>`;
}

function renderArticles() {
  if (!allArticles.length) {
    document.getElementById('newsContainer').innerHTML = `
      <div class="empty-state">
        <div class="icon">🌌</div>
        <p>No articles found.<br>Try a different search or category.</p>
      </div>`;
    return;
  }
  document.getElementById('newsContainer').innerHTML =
    `<div class="news-grid">${allArticles.map((a, i) => cardHTML(a, i)).join('')}</div>`;
}

function updateStats() {
  const shown = allArticles.length;
  document.getElementById('statsText').innerHTML =
    `Showing <span class="stats-count">${shown}</span> of <span class="stats-count">${totalCount.toLocaleString()}</span> articles`;
}

function updateLoadMore(hasNext) {
  const wrap = document.getElementById('loadMoreWrap');
  const btn = document.getElementById('loadMoreBtn');
  if (hasNext && allArticles.length < totalCount) {
    wrap.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Load more articles';
  } else {
    wrap.style.display = 'none';
  }
}

// ── Search & Filter ────────────────────────────────────────
let searchTimer;
document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  document.getElementById('searchClear').style.display = searchQuery ? 'block' : 'none';
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => fetchArticles(), 400);
});

document.getElementById('searchClear').addEventListener('click', () => {
  document.getElementById('searchInput').value = '';
  searchQuery = '';
  document.getElementById('searchClear').style.display = 'none';
  fetchArticles();
});

document.getElementById('categories').addEventListener('click', e => {
  const btn = e.target.closest('.cat-btn');
  if (!btn) return;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeCategory = btn.dataset.cat;
  fetchArticles();
});

document.getElementById('loadMoreBtn').addEventListener('click', () => fetchArticles(true));

// ── Init ───────────────────────────────────────────────────
fetchArticles();
</script>
</body>
</html>
